services:
  - type: web
    name: garmin-dashboard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_TOKEN
        generateValue: true
      - key: GARMIN_TOKENS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
